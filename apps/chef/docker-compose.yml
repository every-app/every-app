services:
  chef:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pnpm install && node ./scripts/docker-selfhost-entrypoint.mjs",
      ]
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "every-app-gateway.localhost:host-gateway"
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://every-app-gateway.localhost:3000}
      VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://every-app-gateway.localhost:3000}
      VITE_APP_ID: ${VITE_APP_ID:-chef}
      GATEWAY_APP_API_TOKEN: ${GATEWAY_APP_API_TOKEN:-}
    volumes:
      - ./:/app
      - chef_node_modules:/app/node_modules
      - chef_pnpm_store:/pnpm/store

volumes:
  chef_node_modules:
  chef_pnpm_store:
