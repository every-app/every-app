# Publishes this app as an Every App release: on every v* tag (and by
# hand), it builds the app, checks it, packs it into
# everyapp-release.tar.gz (`everyapp deploy --bundle-only`) and attaches
# that to the tag's GitHub release. Anyone with a Gateway then installs it
# without cloning this repository:
#
#   everyapp deploy https://github.com/<owner>/<repo>
#
# The build needs no Cloudflare login and no secrets. It runs the everyapp
# CLI from devDependencies; until the CLI is published to npm (it is
# coming), an app created outside the Every App checkout links it from
# there, so point devDependencies.everyapp at the npm package once it is.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm everyapp deploy --bundle-only --out everyapp-release.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" everyapp-release.tar.gz --clobber
          else
            gh release create "$TAG" everyapp-release.tar.gz --generate-notes
          fi
