name: Desktop
# The Every App desktop app (apps/desktop): what pr-checks.yml can't run on a
# plain install. Its type checks and unit tests (apps/desktop and
# apps/desktop/ui) already run there, in the `packages` halves.
#
# - helper: the Swift helper (apps/desktop/mac) builds and its tests pass.
#   macOS only.
#
# Nothing in CI opens the real app: the Electron e2e smoke
# (apps/desktop/README.md, "End-to-end smoke") is run by hand, `pnpm build &&
# pnpm e2e` in apps/desktop on a Mac, or under `xvfb-run -a` on Linux.
#
# Packaging, signing and notarizing need a Mac with the release credentials
# and never run here (apps/desktop/docs/release.md).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/mac/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/mac/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helper:
    name: Swift helper
    # Private repository only, like integration.yml: macOS minutes.
    if: github.repository == 'every-app/private-every-app'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop/mac
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: ./scripts/test.sh
