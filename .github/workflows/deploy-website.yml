name: Deploy website

# Deploys landing-page/ (everyapp.com, Worker `every-app-landing-page`) when a
# merge to main changes it, or by hand: gh workflow run deploy-website.yml
# What it needs and how to roll back: docs/runbooks/site-preflight.md
on:
  push:
    branches: [main]
    paths:
      - landing-page/**
      # The build mirrors it into the agent docs (scripts/sync-agent-docs.js).
      - docs/security.md
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a wrangler upload; a newer push queues behind it.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy everyapp.com
    # The public copy of this repository carries this file too and must not
    # deploy. Only main may use the production environment's credentials.
    if: github.repository == 'every-app/private-every-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://everyapp.com
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker has no bindings beyond its assets and no runtime
          # secrets, so these two are all a deploy needs.
          failed=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production secret or variable: $name (docs/runbooks/site-preflight.md)"
              failed=1
            elif [[ "${!name}" =~ [[:space:]] ]]; then
              echo "::error::$name contains whitespace or a line break; re-enter it"
              failed=1
            fi
          done
          exit "$failed"

      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '^22.18.0'
          cache: pnpm

      # Only the site's own dependencies, and no install scripts: the root
      # postinstall builds the SDK, which the site doesn't use.
      - name: Install the site's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter 'landing-page...'

      - name: Build
        run: pnpm run build
        env:
          # scripts/sync-openscribe-data.js reads public repositories' counts;
          # with a token GitHub's API doesn't rate-limit the runner's address.
          GITHUB_TOKEN: ${{ github.token }}

      # The same check as before a deploy by hand: crawl the build, stop on
      # a broken link or page.
      - name: Preflight the build
        run: |
          pnpm exec vite preview --port 4322 --strictPort </dev/null >"$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4322/ && break
            sleep 1
          done
          pnpm run preflight || { cat "$RUNNER_TEMP/preview.log"; exit 1; }

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
