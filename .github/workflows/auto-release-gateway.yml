name: Auto Release Gateway
on:
  push:
    branches:
      - main
    paths:
      - 'apps/every-app-gateway/**'
jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '"version"' apps/every-app-gateway/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check if version tag already exists
        id: release_check
        run: |
          TAG="gateway-v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists. Skipping release steps."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup pnpm
        if: steps.release_check.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.release_check.outputs.should_release == 'true'
        run: pnpm install --ignore-scripts
      - name: Build gateway and create release package
        if: steps.release_check.outputs.should_release == 'true'
        run: pnpm run build:release
        working-directory: apps/every-app-gateway
      - name: Move tarball to repo root
        if: steps.release_check.outputs.should_release == 'true'
        run: mv apps/every-app-gateway/every-app-gateway-build.tar.gz .
      - name: Create version tag
        if: steps.release_check.outputs.should_release == 'true'
        run: |
          git tag -a "gateway-v${{ steps.version.outputs.version }}" -m "Release gateway version ${{ steps.version.outputs.version }}"
          git push origin "gateway-v${{ steps.version.outputs.version }}"
      - name: Create versioned release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v${{ steps.version.outputs.version }}
          name: Gateway v${{ steps.version.outputs.version }}
          files: every-app-gateway-build.tar.gz
          body: |
            ## Every App Gateway Release v${{ steps.version.outputs.version }}

            ### Contents:
            - `dist/` - Built application
            - `wrangler.jsonc` - Cloudflare configuration
            - `drizzle/` - Database migrations
            - `drizzle.config.ts` - Local Drizzle migration config
            - `package.json` - Package manifest

            ### Usage:
            ```bash
            every gateway deploy
            ```
      - name: Update gateway-latest tag
        if: steps.release_check.outputs.should_release == 'true'
        run: |
          git tag -f gateway-latest
          git push -f origin gateway-latest
      - name: Update gateway-latest release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-latest
          name: Gateway Latest
          files: every-app-gateway-build.tar.gz
          body: |
            ## Every App Gateway - Latest Release

            **Current version:** v${{ steps.version.outputs.version }}

            This release always contains the latest prebuilt version of the gateway application.
            For a specific version, see the [versioned releases](../../releases).

            ### Usage:
            ```bash
            every gateway deploy
            ```
