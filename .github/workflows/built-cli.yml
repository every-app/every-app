name: Built CLI
on:
  # Every pull request, not only ones into main: stacked PRs target the PR
  # below them and still need this.
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
# The CLI as people run it: bin/everyapp.js over the dist/ tsup built, as a
# child process, against a fresh app in a temp directory with no Cloudflare
# account (packages/cli/src/bin/builtCli.test.ts). Every other test resolves
# the workspace packages from source, so none saw what the bundle does
# differently: on 2026-10-24 the built CLI refused every manifest with a
# capability that takes no scope sets (the perimeter's manifest schema,
# inlined into dist, ran against the CLI's zod 4 instead of the perimeter's
# zod 3; #543) while every check here was green. This job runs help for
# every route, create, db migrate, dev to its first page, the capability
# manifests, release and status (against a fake account) on the built CLI.
jobs:
  built-cli:
    name: everyapp from dist/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: 'pnpm'
      - name: Install all dependencies
        run: pnpm install --ignore-scripts
      - name: Build the SDK
        run: pnpm -C packages/sdk build
      - name: Build the CLI
        run: pnpm -C packages/cli build
      - name: Run the built CLI against a fresh app
        run: pnpm -C packages/cli test:built
