name: Security Review
# Anthropic's open-source security review for Claude Code
# (https://github.com/anthropics/claude-code-security-review) reads a pull
# request's diff with the repository as context, drops what is likely a
# false positive, and leaves review comments on the lines it is confident
# about. The same review runs locally as /security-review in Claude Code.
# What it reviews against is docs/threat-model.md; the Every App specifics
# it is told are in .github/security-review/.
#
# It needs an Anthropic API key enabled for Claude Code in this repository's
# secrets as ANTHROPIC_API_KEY. Until one is set the job passes with a
# warning rather than failing every pull request. Pull requests from forks
# skip it: a fork gets no secrets, and the review is not hardened against
# prompt injection, so a stranger's changes get a person's look first
# ("Require approval for all external contributors" in the repository's
# Actions settings).
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write # the review comments
concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security-review:
    name: Claude Code security review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not in this repository's secrets, so the security review did not run. Add a key enabled for Claude Code under Settings → Secrets and variables → Actions."
          fi
      - name: Checkout code
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Review the pull request's changes
        if: steps.key.outputs.configured == 'true'
        # Pinned to a commit of the action's main branch (2026-02-11): it
        # runs with this job's token and the API key, so a branch or tag
        # that can move is not enough.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          upload-results: true
          # Prose, research notes and the landing page's content: nothing
          # there runs.
          exclude-directories: docs,adr,prompts,landing-page/content
          custom-security-scan-instructions: .github/security-review/scan-instructions.md
          false-positive-filtering-instructions: .github/security-review/false-positives.md
