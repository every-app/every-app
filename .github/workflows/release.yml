name: Gateway Release
# Publishes the Gateway release a CLI with no checkout installs
# (packages/cli/src/lib/gateway/source.ts): every-app-gateway-release.tar.gz
# on a GitHub release of this repository. A push of a gateway-v* tag
# releases that tag; a manual run releases the tag it is given, or
# gateway-v<the gateway's version>, made at the commit it runs on. A
# release that exists already gets the tarball replaced. See .github/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: gateway-v<apps/every-app-gateway version>)'
        required: false
        type: string
  push:
    tags:
      - 'gateway-v*'
permissions:
  contents: write
concurrency:
  group: gateway-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish the Gateway release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The release records when the Gateway's sources were last
          # committed (git log), which a shallow clone can't tell.
          fetch-depth: 0
      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: 'pnpm'
      - name: Install all dependencies
        run: pnpm install --ignore-scripts
      - name: Build the SDK
        run: pnpm -C packages/sdk build
      - name: Build the gateway release
        run: pnpm -C apps/every-app-gateway build:release
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tarball=apps/every-app-gateway/every-app-gateway-release.tar.gz
          version=$(node -p "require('./apps/every-app-gateway/package.json').version")
          tag=${PUSHED_TAG:-${INPUT_TAG:-gateway-v$version}}
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$tarball" --clobber
          else
            gh release create "$tag" "$tarball" \
              --target "$GITHUB_SHA" \
              --title "Gateway $version ($tag)" \
              --notes "Every App Gateway $version, built from $GITHUB_SHA. Install or upgrade with: everyapp setup (or everyapp setup --release https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)."
          fi
