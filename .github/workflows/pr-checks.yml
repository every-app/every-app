name: PR Checks
on:
  # Every pull request, not only ones into main: stacked PRs target the PR
  # below them and still need the checks.
  # The orchestrator's overnight notes are pushed often and change no code.
  pull_request:
    paths-ignore:
      - 'docs/overnight/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/overnight/**'
# Checks only read the repository; nothing here needs a writable token.
permissions:
  contents: read
# A new push to a pull request (or to main) cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Fast checks only, six jobs of under two minutes on 2-core runners: lint,
# types in two halves and unit tests in three. Nothing here builds the
# workspace beyond the SDK (the typechecks and tests read the other packages
# from source). The slow
# suites (the CLI's fake-account integration tests, the gateway's SQLite
# tests), the full build, the cf dry run and the built CLI run in
# integration.yml: on demand, nightly and on main.
# Node 22.18+ everywhere: the apps' cloudflare.config.ts is loaded by cf and
# the Cloudflare Vite plugin with Node's built-in TypeScript support.
jobs:
  type-check:
    name: Type Check (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two halves of about equal CPU: tsc over the whole workspace is about
    # 150 CPU-seconds, more than a minute on one of these 2-core runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: gateway
            filter: --filter every-app-gateway --filter landing-page
          - part: packages
            filter: --filter '!every-app-gateway' --filter '!landing-page'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: 'pnpm'
      - name: Install all dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the SDK
        run: pnpm -C packages/sdk build
      - name: Run type checking
        run: pnpm -r --no-bail --parallel ${{ matrix.filter }} run types:check
      # Better Auth validates the Drizzle schema at init and fails every auth
      # request on a mismatch, so a stale auth.schema.ts must not merge.
      - name: Check gateway Better Auth schema
        if: matrix.part == 'gateway'
        run: pnpm -C apps/every-app-gateway auth:check
      - name: Validate SDK relative ESM import extensions
        if: matrix.part == 'packages'
        run: pnpm -C packages/sdk check:esm-relative-imports
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: 'pnpm'
      # One lockfile covers every workspace project, the starter included.
      - name: Fail on critical advisories in the lockfile
        run: pnpm audit --audit-level critical
      # Builds the public copy of this commit in a temporary directory and
      # runs its checks (scripts/public-copy.mjs, docs/runbooks/public-copy.md):
      # a file on the deny list, a secret shape or a private name in the tree
      # fails here, before the copy is ever made. Nothing is written or pushed.
      - name: Prove the public-copy checks refuse what they must
        run: node scripts/public-copy.mjs --self-test
      - name: Dry-run the public copy of this commit
        run: node scripts/public-copy.mjs --commit HEAD --no-fetch
      - name: Install all dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run prettier check
        run: pnpm format:check
      - name: Build the SDK
        run: pnpm -C packages/sdk build
      - name: Run knip check
        run: pnpm knip
  test:
    name: Unit Tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gateway and the CLI each on a runner of their own, the small
    # packages on a third: sharing a 2-core runner, they took four minutes. --maxWorkers=100% gives
    # vitest every core (its default leaves one of a private repository's two
    # idle).
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: gateway
            run: pnpm -C apps/every-app-gateway test --maxWorkers=100%
          - part: cli
            run: pnpm -C packages/cli test --maxWorkers=100%
          - part: packages
            run: pnpm -r --no-bail --parallel --filter '!every-app-gateway' --filter '!everyapp' run test --maxWorkers=100%
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        # The version is package.json's packageManager.
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: 'pnpm'
      - name: Install all dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the SDK
        run: pnpm -C packages/sdk build
      # Each package's `test` is its unit project; `test:integration` runs
      # in integration.yml.
      - name: Run unit tests
        run: ${{ matrix.run }}
